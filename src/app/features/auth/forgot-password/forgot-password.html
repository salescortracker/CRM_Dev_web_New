<div class="pw-page">

  <div class="pw-card">

    <div class="pw-brand">
      <div class="pw-brand-icon">C</div>
      <div class="pw-brand-name">COR<span>CRM</span></div>
    </div>

    <ol class="pw-steps">
      <li class="active">1. Email</li>
      <li>2. Verify OTP</li>
      <li>3. New password</li>
    </ol>

    <div class="pw-header">
      <h2>Forgot <span>password?</span></h2>
      <p>
        Enter the email address linked to your account and we will send you a
        one-time password (OTP) to reset it.
      </p>
    </div>

    <form (ngSubmit)="sendOtp()" novalidate>

      <div class="pw-field">

        <label for="email">Email address <em>*</em></label>

        <div class="pw-input">
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            (ngModelChange)="errorMessage.set('')"
            placeholder="you@company.com"
            autocomplete="email"
          />
          <i class="fa fa-envelope pw-icon"></i>
        </div>

      </div>

      @if (errorMessage()) {
        <div class="pw-error">
          <i class="fa fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="pw-button" [disabled]="loading()">
        @if (loading()) {
          <span class="pw-loader"></span>
          <span>Sending OTP...</span>
        } @else {
          <span>Send OTP</span>
        }
      </button>

    </form>

    <div class="pw-links">
      <a routerLink="/login"><i class="fa fa-arrow-left"></i> Back to sign in</a>
    </div>

  </div>

</div>
