<div class="pw-page embedded">

  <div class="pw-card">

    <div class="pw-header">
      <h2>Change <span>password</span></h2>
      <p>
        Enter your current password, then choose a new one.
      </p>
    </div>

    <form (ngSubmit)="changePassword()" novalidate>

      <div class="pw-field">

        <label for="currentPassword">Current password <em>*</em></label>

        <div class="pw-input">
          <input
            id="currentPassword"
            [type]="showCurrent() ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            (ngModelChange)="errorMessage.set('')"
            placeholder="Enter current password"
            autocomplete="current-password"
          />
          <i class="fa fa-lock pw-icon"></i>
          <button
            type="button"
            class="pw-toggle"
            [attr.aria-label]="showCurrent() ? 'Hide password' : 'Show password'"
            (click)="showCurrent.set(!showCurrent())"
          >
            <i class="fa" [class.fa-eye]="!showCurrent()" [class.fa-eye-slash]="showCurrent()"></i>
          </button>
        </div>

      </div>

      <div class="pw-field">

        <label for="newPassword">New password <em>*</em></label>

        <div class="pw-input">
          <input
            id="newPassword"
            [type]="showNew() ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            (ngModelChange)="errorMessage.set('')"
            placeholder="Enter new password"
            autocomplete="new-password"
          />
          <i class="fa fa-key pw-icon"></i>
          <button
            type="button"
            class="pw-toggle"
            [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
            (click)="showNew.set(!showNew())"
          >
            <i class="fa" [class.fa-eye]="!showNew()" [class.fa-eye-slash]="showNew()"></i>
          </button>
        </div>

        <p class="pw-hint">At least {{ minLength }} characters.</p>

      </div>

      <div class="pw-field">

        <label for="confirmPassword">Confirm new password <em>*</em></label>

        <div class="pw-input">
          <input
            id="confirmPassword"
            [type]="showConfirm() ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            (ngModelChange)="errorMessage.set('')"
            placeholder="Re-enter new password"
            autocomplete="new-password"
          />
          <i class="fa fa-key pw-icon"></i>
          <button
            type="button"
            class="pw-toggle"
            [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
            (click)="showConfirm.set(!showConfirm())"
          >
            <i class="fa" [class.fa-eye]="!showConfirm()" [class.fa-eye-slash]="showConfirm()"></i>
          </button>
        </div>

      </div>

      @if (errorMessage()) {
        <div class="pw-error">
          <i class="fa fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="pw-button" [disabled]="loading()">
        @if (loading()) {
          <span class="pw-loader"></span>
          <span>Updating...</span>
        } @else {
          <span>Change password</span>
        }
      </button>

    </form>

  </div>

</div>
