<div class="pw-page">

  <div class="pw-card">

    <div class="pw-brand">
      <div class="pw-brand-icon">C</div>
      <div class="pw-brand-name">COR<span>CRM</span></div>
    </div>

    <ol class="pw-steps">
      <li class="done">1. Email</li>
      <li class="done">2. Verify OTP</li>
      <li class="active">3. New password</li>
    </ol>

    <div class="pw-header">
      <h2>Reset <span>password</span></h2>
      <p>
        Choose a new password for <strong>{{ email }}</strong>.
      </p>
    </div>

    <form (ngSubmit)="resetPassword()" novalidate>

      <div class="pw-field">

        <label for="newPassword">New password <em>*</em></label>

        <div class="pw-input">
          <input
            id="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            (ngModelChange)="errorMessage.set('')"
            placeholder="Enter new password"
            autocomplete="new-password"
          />
          <i class="fa fa-lock pw-icon"></i>
          <button
            type="button"
            class="pw-toggle"
            [attr.aria-label]="showNewPassword() ? 'Hide password' : 'Show password'"
            (click)="showNewPassword.set(!showNewPassword())"
          >
            <i class="fa" [class.fa-eye]="!showNewPassword()" [class.fa-eye-slash]="showNewPassword()"></i>
          </button>
        </div>

        <p class="pw-hint">At least {{ minLength }} characters.</p>

      </div>

      <div class="pw-field">

        <label for="confirmPassword">Confirm password <em>*</em></label>

        <div class="pw-input">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            (ngModelChange)="errorMessage.set('')"
            placeholder="Re-enter new password"
            autocomplete="new-password"
          />
          <i class="fa fa-lock pw-icon"></i>
          <button
            type="button"
            class="pw-toggle"
            [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
            (click)="showConfirmPassword.set(!showConfirmPassword())"
          >
            <i class="fa" [class.fa-eye]="!showConfirmPassword()" [class.fa-eye-slash]="showConfirmPassword()"></i>
          </button>
        </div>

      </div>

      @if (errorMessage()) {
        <div class="pw-error">
          <i class="fa fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="pw-button" [disabled]="loading()">
        @if (loading()) {
          <span class="pw-loader"></span>
          <span>Updating...</span>
        } @else {
          <span>Reset password</span>
        }
      </button>

    </form>

    <div class="pw-links">
      <a routerLink="/forgot-password">Start over</a>
      <a routerLink="/login">Back to sign in</a>
    </div>

  </div>

</div>
