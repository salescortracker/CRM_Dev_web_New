<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>Brand Management</h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Brand Name <span class="text-danger">*</span></label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Brand Name">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Brand Code <span class="text-danger">*</span></label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Brand Code">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Company</label>
                    <select class="form-select">
                        <option>Select Company</option>
                        <option>ABC Technologies</option>
                        <option>XYZ Solutions</option>
                        <option>Demo Company</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Website</label>
                    <input type="text"
                           class="form-control"
                           placeholder="https://www.company.com">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Support Email</label>
                    <input type="email"
                           class="form-control"
                           placeholder="support@company.com">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Support Phone</label>
                    <input type="text"
                           class="form-control"
                           placeholder="+1 555 123456">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Primary Color</label>
                    <input type="color"
                           class="form-control form-control-color"
                           value="#b02828">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Secondary Color</label>
                    <input type="color"
                           class="form-control form-control-color"
                           value="#000000">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Logo</label>
                    <input type="file"
                           class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Description</label>
                    <textarea class="form-control"
                              rows="3"
                              placeholder="Brand Description"></textarea>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Active
                    </label>
                </div>

            </div>

            <button class="btn btn-danger me-2">
                Save
            </button>

            <button class="btn btn-warning me-2">
                Update
            </button>

            <button class="btn btn-secondary">
                Clear
            </button>

        </div>

    </div>

    <br>

    <div class="row mb-3">

        <div class="col-md-4">
            <input type="text"
                   class="form-control"
                   placeholder="Search Brand...">
        </div>

        <div class="col-md-4">
            <select class="form-select">
                <option>All Companies</option>
                <option>ABC Technologies</option>
                <option>XYZ Solutions</option>
            </select>
        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-danger">

            <tr>

                <th>#</th>
                <th>Logo</th>
                <th>Brand Name</th>
                <th>Brand Code</th>
                <th>Company</th>
                <th>Website</th>
                <th>Theme</th>
                <th>Status</th>
                <th width="170">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>1</td>
                <td>
                    <img src="assets/images/logo.png"
                         width="40">
                </td>

                <td>CorTracker CRM</td>

                <td>CRM001</td>

                <td>ABC Technologies</td>

                <td>www.cortracker.com</td>

                <td>
                    <span style="display:inline-block;width:18px;height:18px;background:#b02828;border-radius:50%;margin-right:5px;"></span>
                    <span style="display:inline-block;width:18px;height:18px;background:#000;border-radius:50%;"></span>
                </td>

                <td>
                    <span class="badge bg-success">
                        Active
                    </span>
                </td>

                <td>

                    <button class="btn btn-warning btn-sm me-1">
                        Edit
                    </button>

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </td>

            </tr>

            <tr>

                <td>2</td>

                <td>
                    <img src="assets/images/logo2.png"
                         width="40">
                </td>

                <td>SalesPro CRM</td>

                <td>CRM002</td>

                <td>XYZ Solutions</td>

                <td>www.salespro.com</td>

                <td>
                    <span style="display:inline-block;width:18px;height:18px;background:#1565c0;border-radius:50%;margin-right:5px;"></span>
                    <span style="display:inline-block;width:18px;height:18px;background:#eeeeee;border-radius:50%;"></span>
                </td>

                <td>
                    <span class="badge bg-success">
                        Active
                    </span>
                </td>

                <td>

                    <button class="btn btn-warning btn-sm me-1">
                        Edit
                    </button>

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

 

</div>
