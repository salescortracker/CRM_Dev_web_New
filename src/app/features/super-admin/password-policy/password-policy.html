<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>Password Policy</h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Policy Name <span class="text-danger">*</span></label>
                    <input class="form-control"
                           placeholder="Default CRM Password Policy">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Minimum Password Length</label>
                    <input type="number"
                           class="form-control"
                           value="8">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Maximum Password Length</label>
                    <input type="number"
                           class="form-control"
                           value="32">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Password Expiry (Days)</label>
                    <input type="number"
                           class="form-control"
                           value="90">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Password History</label>
                    <input type="number"
                           class="form-control"
                           value="5">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Maximum Failed Login Attempts</label>
                    <input type="number"
                           class="form-control"
                           value="5">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Account Lock Duration (Minutes)</label>
                    <input type="number"
                           class="form-control"
                           value="30">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Session Timeout (Minutes)</label>
                    <input type="number"
                           class="form-control"
                           value="30">
                </div>

                <div class="col-md-4 mb-3">
                    <label>MFA Requirement</label>
                    <select class="form-select">
                        <option>Disabled</option>
                        <option>Optional</option>
                        <option>Mandatory</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Require Uppercase Letter
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Require Lowercase Letter
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Require Number
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Require Special Character
                    </label>
                </div>

                <div class="col-md-3 mt-3">
                    <label>
                        <input type="checkbox" checked>
                        Prevent Username in Password
                    </label>
                </div>

                <div class="col-md-3 mt-3">
                    <label>
                        <input type="checkbox" checked>
                        Force Password Change on First Login
                    </label>
                </div>

                <div class="col-md-3 mt-3">
                    <label>
                        <input type="checkbox">
                        Allow Password Reuse
                    </label>
                </div>

                <div class="col-md-3 mt-3">
                    <label>
                        <input type="checkbox" checked>
                        Policy Active
                    </label>
                </div>

            </div>

            <button class="btn btn-danger me-2">
                Save
            </button>

            <button class="btn btn-secondary">
                Clear
            </button>

        </div>

    </div>

    <br>

    <div class="row mb-3">

        <div class="col-md-4">
            <input class="form-control"
                   placeholder="Search Password Policy...">
        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-danger">

            <tr>

                <th>#</th>
                <th>Policy Name</th>
                <th>Min Length</th>
                <th>Expiry</th>
                <th>Failed Attempts</th>
                <th>MFA</th>
                <th>Status</th>
                <th width="150">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Default CRM Policy</td>
                <td>8</td>
                <td>90 Days</td>
                <td>5</td>
                <td>Mandatory</td>
                <td>Active</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Administrator Policy</td>
                <td>12</td>
                <td>60 Days</td>
                <td>3</td>
                <td>Mandatory</td>
                <td>Active</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>Guest User Policy</td>
                <td>8</td>
                <td>180 Days</td>
                <td>5</td>
                <td>Optional</td>
                <td>Inactive</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                </td>
            </tr>

        </tbody>

    </table>

 

</div>
