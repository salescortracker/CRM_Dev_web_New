<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>Custom Reports</h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-3 mb-3">
                    <label>Report Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Report Name">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Module</label>
                    <select class="form-select">
                        <option>Leads</option>
                        <option>Contacts</option>
                        <option>Accounts</option>
                        <option>Opportunities</option>
                        <option>Projects</option>
                        <option>Support</option>
                        <option>Invoices</option>
                        <option>Users</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Report Type</label>
                    <select class="form-select">
                        <option>Tabular</option>
                        <option>Summary</option>
                        <option>Matrix</option>
                        <option>Chart</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Output Format</label>
                    <select class="form-select">
                        <option>PDF</option>
                        <option>Excel</option>
                        <option>CSV</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Group By</label>
                    <select class="form-select">
                        <option>Company</option>
                        <option>Department</option>
                        <option>Owner</option>
                        <option>Status</option>
                        <option>Created Date</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Sort By</label>
                    <select class="form-select">
                        <option>Created Date</option>
                        <option>Modified Date</option>
                        <option>Name</option>
                        <option>Status</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Date Range</label>
                    <select class="form-select">
                        <option>Today</option>
                        <option>This Week</option>
                        <option>This Month</option>
                        <option>This Year</option>
                        <option>Custom</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>
                        <input type="checkbox" checked>
                        Include Charts
                    </label>
                </div>

                <div class="col-md-4">
                    <label>
                        <input type="checkbox" checked>
                        Schedule Report
                    </label>
                </div>

                <div class="col-md-4">
                    <label>
                        <input type="checkbox">
                        Email Automatically
                    </label>
                </div>

            </div>

            <button class="btn btn-danger me-2">
                Generate Report
            </button>

            <button class="btn btn-primary me-2">
                Save Report
            </button>

            <button class="btn btn-secondary me-2">
                Clear
            </button>

            <button class="btn btn-success">
                Export
            </button>

        </div>

    </div>

    <br>

    <div class="row mb-3">

        <div class="col-md-4">
            <input class="form-control"
                   placeholder="Search Report...">
        </div>

        <div class="col-md-4">
            <select class="form-select">
                <option>All Modules</option>
                <option>Sales</option>
                <option>Support</option>
                <option>Projects</option>
                <option>Finance</option>
            </select>
        </div>

        <div class="col-md-4">
            <button class="btn btn-danger w-100">
                Search
            </button>
        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-danger">

            <tr>

                <th>#</th>
                <th>Report Name</th>
                <th>Module</th>
                <th>Report Type</th>
                <th>Created By</th>
                <th>Created On</th>
                <th>Status</th>
                <th width="180">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Monthly Sales Summary</td>
                <td>Sales</td>
                <td>Summary</td>
                <td>Super Admin</td>
                <td>27-Jul-2026</td>
                <td><span class="badge bg-success">Active</span></td>
                <td>
                    <button class="btn btn-info btn-sm me-1">Run</button>
                    <button class="btn btn-warning btn-sm">Edit</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Lead Conversion Analysis</td>
                <td>Leads</td>
                <td>Chart</td>
                <td>System</td>
                <td>25-Jul-2026</td>
                <td><span class="badge bg-success">Scheduled</span></td>
                <td>
                    <button class="btn btn-info btn-sm me-1">Run</button>
                    <button class="btn btn-warning btn-sm">Edit</button>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>Support Ticket SLA</td>
                <td>Support</td>
                <td>Matrix</td>
                <td>Super Admin</td>
                <td>20-Jul-2026</td>
                <td><span class="badge bg-primary">Draft</span></td>
                <td>
                    <button class="btn btn-info btn-sm me-1">Run</button>
                    <button class="btn btn-warning btn-sm">Edit</button>
                </td>
            </tr>

        </tbody>

    </table>



</div>
