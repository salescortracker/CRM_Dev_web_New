<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>File Storage Management</h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Storage Provider <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option>Local Storage</option>
                        <option>Azure Blob Storage</option>
                        <option>AWS S3</option>
                        <option>Google Cloud Storage</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Storage Name</label>
                    <input class="form-control"
                           value="CRM Production Storage">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Root Folder</label>
                    <input class="form-control"
                           value="/crm/storage/">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Maximum File Size (MB)</label>
                    <input type="number"
                           class="form-control"
                           value="50">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Company Storage Limit (GB)</label>
                    <input type="number"
                           class="form-control"
                           value="100">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Allowed File Types</label>
                    <input class="form-control"
                           value="PDF,DOCX,XLSX,PPTX,JPG,PNG,ZIP">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Backup Frequency</label>
                    <select class="form-select">
                        <option>Daily</option>
                        <option>Weekly</option>
                        <option>Monthly</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Retention Period</label>
                    <select class="form-select">
                        <option>30 Days</option>
                        <option>90 Days</option>
                        <option>180 Days</option>
                        <option>365 Days</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Encryption</label>
                    <select class="form-select">
                        <option>AES-256</option>
                        <option>AES-128</option>
                        <option>None</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Enable File Versioning
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Enable Virus Scan
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Enable Compression
                    </label>
                </div>

                <div class="col-md-3">
                    <label>
                        <input type="checkbox" checked>
                        Active
                    </label>
                </div>

            </div>

            <button class="btn btn-danger me-2">Save</button>

            <button class="btn btn-warning me-2">Update</button>

            <button class="btn btn-secondary">Clear</button>

        </div>

    </div>

    <br>

    <div class="row mb-3">

        <div class="col-md-4">
            <input class="form-control"
                   placeholder="Search Storage Configuration...">
        </div>

        <div class="col-md-4">
            <select class="form-select">
                <option>All Providers</option>
                <option>Local Storage</option>
                <option>Azure Blob</option>
                <option>AWS S3</option>
            </select>
        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-danger">

            <tr>

                <th>#</th>
                <th>Provider</th>
                <th>Storage Name</th>
                <th>Company Limit</th>
                <th>File Size</th>
                <th>Backup</th>
                <th>Status</th>
                <th width="180">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>1</td>
                <td>Azure Blob</td>
                <td>CRM Production</td>
                <td>100 GB</td>
                <td>50 MB</td>
                <td>Daily</td>
                <td>
                    <span class="badge bg-success">Active</span>
                </td>

                <td>

                    <button class="btn btn-warning btn-sm me-1">
                        Edit
                    </button>

                    <button class="btn btn-info btn-sm me-1">
                        Test
                    </button>

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </td>

            </tr>

            <tr>

                <td>2</td>
                <td>AWS S3</td>
                <td>CRM Archive</td>
                <td>500 GB</td>
                <td>100 MB</td>
                <td>Weekly</td>
                <td>
                    <span class="badge bg-secondary">Inactive</span>
                </td>

                <td>

                    <button class="btn btn-warning btn-sm me-1">
                        Edit
                    </button>

                    <button class="btn btn-info btn-sm me-1">
                        Test
                    </button>

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </td>

            </tr>

        </tbody>

    </table>


</div>
