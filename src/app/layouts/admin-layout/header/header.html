<header class="crm-header">
  <div class="status-strip d-flex align-items-center gap-4">
    <span><strong>Status:</strong> Active</span>
    <span><strong>Last Update:</strong> Just now</span>
    <span><strong>Pipeline Value:</strong> $500,000</span>
  </div>

  <div class="workspace-bar d-flex align-items-center justify-content-between gap-3">
    <div class="workspace-title">CRM Workspace</div>

    <div class="header-actions d-flex align-items-center gap-3">
      <div class="search-box d-none d-md-flex align-items-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" class="form-control" placeholder="Search CRM" aria-label="Search CRM">
      </div>

      <button class="icon-btn" type="button" aria-label="Copy link">
        <i class="fa-solid fa-link"></i>
      </button>

      <button class="icon-btn badge-btn" type="button" aria-label="Notifications">
        <i class="fa-solid fa-bell"></i>
        <span class="count-badge">3</span>
      </button>

      <button class="icon-btn badge-btn" type="button" aria-label="Messages">
        <i class="fa-solid fa-envelope"></i>
        <span class="count-badge">2</span>
      </button>

      <button class="icon-btn" type="button" aria-label="Theme">
        <i class="fa-solid fa-moon"></i>
      </button>

      <div class="user-menu d-flex align-items-center gap-2">
        <span class="welcome-text d-none d-lg-inline">
          Welcome, {{ userName }} ({{ userRole }})
        </span>
        <span class="avatar d-inline-flex align-items-center justify-content-center">
          {{ initials }}
        </span>
        <button class="icon-btn" type="button" aria-label="Logout" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </div>
</header>
