<div class="d-flex justify-content-between align-items-center mt-3">

    <div>

        Show

        <select
        class="form-select d-inline w-auto mx-2"
        [value]="pageSize"
        (change)="pageSizeChanged.emit(+$any($event.target).value)">

            <option *ngFor="let s of pageSizes"
                    [value]="s">

                {{s}}

            </option>

        </select>

        entries

    </div>

    <div>

        <button
        class="btn btn-outline-secondary btn-sm me-2"
        (click)="previous()"
        [disabled]="page==1">

            Previous

        </button>

        <span>

            Page {{page}}

            of

            {{totalPages}}

        </span>

        <button
        class="btn btn-outline-secondary btn-sm ms-2"
        (click)="next()"
        [disabled]="page==totalPages">

            Next

        </button>

    </div>

</div>
